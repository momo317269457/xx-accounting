<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DD5C8" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#3DD5C8" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <rect x="30" y="30" width="340" height="240" rx="14" fill="var(--surface,#fff)" stroke="var(--border,#e0e4ed)" stroke-width="1.5"/>
  <!-- Store front -->
  <rect x="100" y="50" width="200" height="150" rx="10" fill="var(--surface,#fff)" stroke="var(--border,#e0e4ed)" stroke-width="1.5"/>
  <!-- Roof -->
  <rect x="90" y="40" width="220" height="16" rx="8" fill="url(#g2)"/>
  <!-- Sign -->
  <rect x="130" y="56" width="140" height="24" rx="6" fill="url(#g1)"/>
  <text x="200" y="73" text-anchor="middle" font-size="11" fill="#4A7CF7" font-weight="600">连锁门店</text>
  <!-- Door -->
  <rect x="175" y="120" width="50" height="80" rx="5" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width="1.5"/>
  <rect x="175" y="120" width="50" height="6" fill="var(--border,#e0e4ed)"/>
  <circle cx="218" cy="165" r="3" fill="var(--border,#e0e4ed)"/>
  <!-- Windows -->
  <rect x="112" y="90" width="48" height="40" rx="5" fill="url(#g3)" stroke="var(--border,#e0e4ed)" stroke-width="1"/>
  <rect x="240" y="90" width="48" height="40" rx="5" fill="url(#g3)" stroke="var(--border,#e0e4ed)" stroke-width="1"/>
  <!-- Awning -->
  <rect x="110" y="82" width="180" height="8" rx="4" fill="url(#g2)" opacity=".5"/>
  <!-- Branch markers -->
  <circle cx="50" cy="120" r="6" fill="#4A7CF7" opacity=".3"/>
  <circle cx="50" cy="140" r="6" fill="#4A7CF7" opacity=".2"/>
  <circle cx="50" cy="160" r="6" fill="#4A7CF7" opacity=".1"/>
  <line x1="56" y1="120" x2="100" y2="120" stroke="var(--border,#e0e4ed)" stroke-width="1" stroke-dasharray="3"/>
  <line x1="56" y1="140" x2="100" y2="140" stroke="var(--border,#e0e4ed)" stroke-width="1" stroke-dasharray="3"/>
  <line x1="56" y1="160" x2="100" y2="160" stroke="var(--border,#e0e4ed)" stroke-width="1" stroke-dasharray="3"/>
  <text x="50" y="113" text-anchor="middle" font-size="8" fill="oklch(54% 0.012 250)">店1</text>
  <text x="50" y="133" text-anchor="middle" font-size="8" fill="oklch(54% 0.012 250)">店2</text>
  <text x="50" y="153" text-anchor="middle" font-size="8" fill="oklch(54% 0.012 250)">店3</text>
  <!-- Tags -->
  <rect x="75" y="230" width="80" height="22" rx="11" fill="url(#g1)"/>
  <text x="115" y="245" text-anchor="middle" font-size="9" fill="#4A7CF7">多门店核算</text>
  <rect x="175" y="230" width="80" height="22" rx="11" fill="url(#g1)"/>
  <text x="215" y="245" text-anchor="middle" font-size="9" fill="#3DD5C8">集中报税</text>
  <rect x="275" y="230" width="80" height="22" rx="11" fill="url(#g1)"/>
  <text x="315" y="245" text-anchor="middle" font-size="9" fill="#4A7CF7">统一标准</text>
</svg>