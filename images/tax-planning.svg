<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DD5C8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#3DD5C8" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <!-- Title area -->
  <rect x="30" y="20" width="340" height="36" rx="10" fill="url(#g1)"/>
  <text x="200" y="44" text-anchor="middle" font-size="13" fill="#4A7CF7" font-weight="700" font-family="system-ui,sans-serif">税务筹划方案对比</text>
  <!-- Before card -->
  <rect x="30" y="70" width="160" height="200" rx="12" fill="var(--surface,#fff)" stroke="#FF6B6B" stroke-width="1.5" stroke-opacity=".4"/>
  <rect x="30" y="70" width="160" height="36" rx="12" fill="#FF6B6B" fill-opacity=".1"/>
  <rect x="30" y="94" width="160" height="12" fill="#FF6B6B" fill-opacity=".1"/>
  <text x="110" y="93" text-anchor="middle" font-size="13" fill="#FF6B6B" font-weight="600">筹划前</text>
  <!-- Before items -->
  <text x="46" y="126" font-size="10" fill="oklch(54% 0.012 250)">综合税负</text>
  <text x="170" y="126" text-anchor="end" font-size="12" fill="#FF6B6B" font-weight="700">28.5%</text>
  <rect x="46" y="134" width="128" height="6" rx="3" fill="url(#g1)"/>
  <rect x="46" y="134" width="100" height="6" rx="3" fill="#FF6B6B" fill-opacity=".5"/>
  <text x="46" y="158" font-size="10" fill="oklch(54% 0.012 250)">增值税</text>
  <text x="170" y="158" text-anchor="end" font-size="12" fill="#FF6B6B" font-weight="700">13%</text>
  <rect x="46" y="166" width="128" height="6" rx="3" fill="url(#g1)"/>
  <rect x="46" y="166" width="90" height="6" rx="3" fill="#FF6B6B" fill-opacity=".5"/>
  <text x="46" y="190" font-size="10" fill="oklch(54% 0.012 250)">企业所得税</text>
  <text x="170" y="190" text-anchor="end" font-size="12" fill="#FF6B6B" font-weight="700">25%</text>
  <rect x="46" y="198" width="128" height="6" rx="3" fill="url(#g1)"/>
  <rect x="46" y="198" width="88" height="6" rx="3" fill="#FF6B6B" fill-opacity=".5"/>
  <!-- Total -->
  <rect x="46" y="220" width="128" height="24" rx="8" fill="#FF6B6B" fill-opacity=".08"/>
  <text x="52" y="236" font-size="10" fill="#FF6B6B" font-weight="600">综合税负</text>
  <text x="168" y="236" text-anchor="end" font-size="12" fill="#FF6B6B" font-weight="700">≈ 35%</text>
  <!-- VS -->
  <text x="200" y="150" text-anchor="middle" font-size="14" fill="var(--border,#e0e4ed)" font-weight="700">VS</text>
  <!-- After card -->
  <rect x="210" y="70" width="160" height="200" rx="12" fill="var(--surface,#fff)" stroke="#3DD5C8" stroke-width="1.5" stroke-opacity=".5"/>
  <rect x="210" y="70" width="160" height="36" rx="12" fill="#3DD5C8" fill-opacity=".1"/>
  <rect x="210" y="94" width="160" height="12" fill="#3DD5C8" fill-opacity=".1"/>
  <text x="290" y="93" text-anchor="middle" font-size="13" fill="#3DD5C8" font-weight="600">筹划后</text>
  <!-- After items -->
  <text x="226" y="126" font-size="10" fill="oklch(54% 0.012 250)">综合税负</text>
  <text x="350" y="126" text-anchor="end" font-size="12" fill="#3DD5C8" font-weight="700">10.2%</text>
  <rect x="226" y="134" width="128" height="6" rx="3" fill="url(#g1)"/>
  <rect x="226" y="134" width="40" height="6" rx="3" fill="#3DD5C8"/>
  <text x="226" y="158" font-size="10" fill="oklch(54% 0.012 250)">增值税优化</text>
  <text x="350" y="158" text-anchor="end" font-size="12" fill="#3DD5C8" font-weight="700">6%</text>
  <rect x="226" y="166" width="128" height="6" rx="3" fill="url(#g1)"/>
  <rect x="226" y="166" width="24" height="6" rx="3" fill="#3DD5C8"/>
  <text x="226" y="190" font-size="10" fill="oklch(54% 0.012 250)">企业所得税</text>
  <text x="350" y="190" text-anchor="end" font-size="12" fill="#3DD5C8" font-weight="700">15%</text>
  <rect x="226" y="198" width="128" height="6" rx="3" fill="url(#g1)"/>
  <rect x="226" y="198" width="48" height="6" rx="3" fill="#3DD5C8"/>
  <!-- Total -->
  <rect x="226" y="220" width="128" height="24" rx="8" fill="#3DD5C8" fill-opacity=".1"/>
  <text x="232" y="236" font-size="10" fill="#3DD5C8" font-weight="600">综合税负</text>
  <text x="348" y="236" text-anchor="end" font-size="12" fill="#3DD5C8" font-weight="700">≈ 15%</text>
  <!-- Savings badge -->
  <rect x="140" y="278" width="120" height="18" rx="9" fill="url(#g1)"/>
  <text x="200" y="291" text-anchor="middle" font-size="9" fill="#4A7CF7" font-family="system-ui,sans-serif">预计可节省 50%-70%</text>
</svg>