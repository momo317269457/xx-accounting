<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".01"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect x="0" y="0" width="400" height="300" fill="url(#sky)"/>
  <!-- Building -->
  <rect x="100" y="60" width="200" height="200" rx="6" fill="var(--surface,#fff)" stroke="var(--border,#e0e4ed)" stroke-width="1.5"/>
  <!-- Building windows row 1 -->
  <rect x="118" y="80" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="166" y="80" width="36" height="32" rx="4" fill="url(#g2)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="214" y="80" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="262" y="80" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <!-- row 2 -->
  <rect x="118" y="124" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="166" y="124" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="214" y="124" width="36" height="32" rx="4" fill="url(#g2)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="262" y="124" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <!-- row 3 -->
  <rect x="118" y="168" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="166" y="168" width="36" height="32" rx="4" fill="url(#g2)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="214" y="168" width="36" height="32" rx="4" fill="url(#g1)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <rect x="262" y="168" width="36" height="32" rx="4" fill="url(#g2)" stroke="var(--border,#e0e4ed)" stroke-width=".8"/>
  <!-- Entrance -->
  <rect x="175" y="212" width="50" height="48" rx="6" fill="var(--surface,#fff)" stroke="var(--border,#e0e4ed)" stroke-width="1.5"/>
  <rect x="175" y="212" width="50" height="4" fill="var(--border,#e0e4ed)"/>
  <rect x="215" y="220" width="30" height="40" rx="3" fill="url(#g1)"/>
  <!-- Door handle -->
  <circle cx="210" cy="240" r="3" fill="var(--border,#e0e4ed)"/>
  <!-- Building name -->
  <rect x="130" y="48" width="140" height="14" rx="7" fill="url(#g1)"/>
  <text x="200" y="58" text-anchor="middle" font-size="8" fill="#4A7CF7">仟企财税 · 专业服务</text>
  <!-- People icons -->
  <circle cx="155" y="252" r="6" fill="oklch(92% 0.005 250)" stroke="var(--border,#e0e4ed)" stroke-width="1"/>
  <circle cx="155" y="252" r="2.5" fill="var(--border,#e0e4ed)"/>
  <circle cx="185" y="252" r="6" fill="oklch(92% 0.005 250)" stroke="var(--border,#e0e4ed)" stroke-width="1"/>
  <circle cx="185" y="252" r="2.5" fill="var(--border,#e0e4ed)"/>
  <circle cx="215" y="252" r="6" fill="oklch(92% 0.005 250)" stroke="var(--border,#e0e4ed)" stroke-width="1"/>
  <circle cx="215" y="252" r="2.5" fill="var(--border,#e0e4ed)"/>
  <!-- Trees -->
  <rect x="78" y="200" width="8" height="30" rx="3" fill="var(--border,#e0e4ed)"/>
  <circle cx="82" cy="190" r="18" fill="#3DD5C8" fill-opacity=".3"/>
  <circle cx="82" cy="195" r="12" fill="#3DD5C8" fill-opacity=".2"/>
  <rect x="314" y="210" width="8" height="20" rx="3" fill="var(--border,#e0e4ed)"/>
  <circle cx="318" cy="200" r="18" fill="#3DD5C8" fill-opacity=".3"/>
  <circle cx="318" cy="205" r="12" fill="#3DD5C8" fill-opacity=".2"/>
  <!-- Ground -->
  <rect x="0" y="260" width="400" height="40" fill="var(--surface,#fff)" opacity=".5"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="var(--border,#e0e4ed)" stroke-width="1"/>
</svg>