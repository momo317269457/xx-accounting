<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#4A7CF7" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DD5C8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#3DD5C8" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <!-- Calendar -->
  <rect x="40" y="30" width="320" height="240" rx="14" fill="var(--surface,#fff)" stroke="var(--border,#e0e4ed)" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="40" y="30" width="320" height="48" rx="14" fill="url(#g2)"/>
  <rect x="40" y="64" width="320" height="14" fill="url(#g2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">2026年6月</text>
  <text x="80" y="54" font-size="11" fill="rgba(255,255,255,.7)" font-family="system-ui,sans-serif">←</text>
  <text x="320" y="54" text-anchor="end" font-size="11" fill="rgba(255,255,255,.7)" font-family="system-ui,sans-serif">→</text>
  <!-- Weekday headers -->
  <text x="72" y="94" text-anchor="middle" font-size="10" fill="oklch(54% 0.012 250)" font-weight="600">一</text>
  <text x="118" y="94" text-anchor="middle" font-size="10" fill="oklch(54% 0.012 250)" font-weight="600">二</text>
  <text x="164" y="94" text-anchor="middle" font-size="10" fill="oklch(54% 0.012 250)" font-weight="600">三</text>
  <text x="210" y="94" text-anchor="middle" font-size="10" fill="oklch(54% 0.012 250)" font-weight="600">四</text>
  <text x="256" y="94" text-anchor="middle" font-size="10" fill="oklch(54% 0.012 250)" font-weight="600">五</text>
  <text x="302" y="94" text-anchor="middle" font-size="10" fill="oklch(54% 0.012 250)" font-weight="600">六</text>
  <text x="348" y="94" text-anchor="middle" font-size="10" fill="oklch(54% 0.012 250)" font-weight="600">日</text>
  <!-- Days - June 2026 starts on Monday -->
  <text x="72" y="120" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">1</text>
  <text x="118" y="120" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">2</text>
  <text x="164" y="120" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">3</text>
  <text x="210" y="120" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">4</text>
  <text x="256" y="120" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">5</text>
  <text x="302" y="120" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">6</text>
  <text x="348" y="120" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">7</text>
  <text x="72" y="146" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">8</text>
  <text x="118" y="146" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">9</text>
  <text x="164" y="146" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">10</text>
  <text x="210" y="146" text-anchor="middle" font-size="13" fill="#4A7CF7" font-weight="700">11</text>
  <text x="256" y="146" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">12</text>
  <text x="302" y="146" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">13</text>
  <text x="348" y="146" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">14</text>
  <text x="72" y="172" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">15</text>
  <!-- 15 highlighted as tax deadline -->
  <rect x="60" y="158" width="24" height="24" rx="5" fill="#4A7CF7"/>
  <text x="72" y="175" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">15</text>
  <text x="118" y="172" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">16</text>
  <text x="164" y="172" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">17</text>
  <text x="210" y="172" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">18</text>
  <text x="256" y="172" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">19</text>
  <text x="302" y="172" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">20</text>
  <text x="348" y="172" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">21</text>
  <text x="72" y="198" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">22</text>
  <text x="118" y="198" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">23</text>
  <text x="164" y="198" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">24</text>
  <text x="210" y="198" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">25</text>
  <text x="256" y="198" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">26</text>
  <text x="302" y="198" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">27</text>
  <text x="348" y="198" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">28</text>
  <text x="72" y="224" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">29</text>
  <text x="118" y="224" text-anchor="middle" font-size="13" fill="var(--fg,#1a1a1a)">30</text>
  <!-- Badge for tax deadline -->
  <rect x="50" y="238" width="100" height="22" rx="11" fill="url(#g1)" stroke="#4A7CF7" stroke-width="1"/>
  <text x="100" y="253" text-anchor="middle" font-size="9" fill="#4A7CF7" font-family="system-ui,sans-serif">申报截止日 6月15日</text>
  <!-- Checkmark on completed -->
  <rect x="250" y="232" width="100" height="22" rx="11" fill="url(#g1)"/>
  <text x="256" y="247" font-size="9" fill="#3DD5C8" font-family="system-ui,sans-serif">✓ 已完成申报</text>
  <!-- Checklist on side -->
  <rect x="290" y="110" width="60" height="18" rx="4" fill="url(#g1)"/>
  <text x="296" y="123" font-size="8" fill="#3DD5C8" font-family="system-ui,sans-serif">✓ 增值税</text>
  <rect x="290" y="132" width="60" height="18" rx="4" fill="url(#g1)"/>
  <text x="296" y="145" font-size="8" fill="#3DD5C8" font-family="system-ui,sans-serif">✓ 个税</text>
  <rect x="290" y="154" width="60" height="18" rx="4" fill="url(#g1)"/>
  <text x="296" y="167" font-size="8" fill="oklch(54% 0.012 250)" font-family="system-ui,sans-serif">○ 所得税</text>
</svg>